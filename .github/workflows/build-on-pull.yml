name: Build and Test on Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Setup Signing Keystore (if secret provided)
      id: signing_setup
      shell: bash
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        if [[ -n "${KEYSTORE_B64:-}" ]]; then
          mkdir -p presentation
          echo "$KEYSTORE_B64" | base64 -d > presentation/my-release-key.keystore
          chmod 600 presentation/my-release-key.keystore
          echo "CI=true" >> "$GITHUB_ENV"
          echo "keystore_password=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "key_password=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "is_release=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_release=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build with Gradle
      run: |
        if [[ "${{ steps.signing_setup.outputs.is_release }}" == "true" ]]; then
          ./gradlew assembleRelease
        else
          ./gradlew assembleDebug
        fi

    - name: Locate and Package APK
      shell: bash
      run: |
        mkdir -p output_apk
        apk_file=$(find presentation/build/outputs/apk/ -name "*.apk" | head -n 1)
        if [[ -n "$apk_file" ]]; then
          cp "$apk_file" output_apk/quik-app.apk
          echo "Found APK: $apk_file"
        else
          echo "No APK generated" >&2
          exit 1
        fi

    - name: Upload App
      uses: actions/upload-artifact@v7
      with:
        name: quik-app
        path: output_apk/quik-app.apk

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Run Tests
        run: ./gradlew test
