name: Build Personal Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Signing Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p presentation
          echo "$KEYSTORE_B64" | base64 -d > presentation/my-release-key.keystore
          chmod 600 presentation/my-release-key.keystore

          {
            echo "CI=true"
            echo "keystore_password=$KEYSTORE_PASSWORD"
            echo "key_alias=$KEY_ALIAS"
            echo "key_password=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew assembleRelease -x lint

      - name: Prepare APK for download
        shell: bash
        run: |
          mkdir -p output_apk
          find presentation/build/outputs/apk/release/ -name "*.apk" -exec cp {} output_apk/quik-personal-release.apk \;

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quik-personal-release-apk
          path: output_apk/quik-personal-release.apk
          retention-days: 30
