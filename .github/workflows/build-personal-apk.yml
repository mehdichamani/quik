name: Build Personal APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew assembleDebug -x lint

      - name: Prepare APK for download
        shell: bash
        run: |
          mkdir -p output_apk
          find presentation/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/quik-personal-debug.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quik-personal-debug-apk
          path: output_apk/quik-personal-debug.apk
          retention-days: 14
